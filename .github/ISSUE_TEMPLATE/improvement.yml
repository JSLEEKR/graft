name: Improvement
description: Suggest an improvement discovered during testing
title: "[IMPROVE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose improvements to the Graft compiler discovered during testing or development.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of the compiler does this improvement target?
      options:
        - grammar
        - codegen
        - analyzer
        - cli
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the improvement clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this improvement needed? What problem does it solve or what opportunity does it create?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How should this improvement be implemented? Include any design considerations.
    validations:
      required: false
